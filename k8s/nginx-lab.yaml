apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-lab
  namespace: devops-lab
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-lab
  template:
    metadata:
      labels:
        app: nginx-lab
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-lab
  namespace: devops-lab
spec:
  type: NodePort
  selector:
    app: nginx-lab
  ports:
    - port: 80
      targetPort: 80
      nodePort: 31805
